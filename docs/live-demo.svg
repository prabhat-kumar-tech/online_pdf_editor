<svg xmlns="http://www.w3.org/2000/svg" width="340" height="84" viewBox="0 0 340 84" role="img" aria-label="Live demo - open the app">
  <title>Live demo</title>
  <defs>
    <!-- gradient that flows left to right (reflect repeat => seamless loop) -->
    <linearGradient id="flow" x1="0" y1="0" x2="0.5" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="pill"><rect x="14" y="12" width="312" height="60" rx="30"/></clipPath>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="190%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- pulsing ring -->
  <rect x="14" y="12" width="312" height="60" rx="30" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.8">
    <animate attributeName="x" values="14;1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="12;0" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="width" values="312;338" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="height" values="60;84" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="30;42" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- button body (gentle breathing) -->
  <g filter="url(#soft)">
    <rect x="14" y="12" width="312" height="60" rx="30" fill="url(#flow)">
      <animate attributeName="y" values="12;10;12" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- shimmer sweep, clipped to the pill -->
  <g clip-path="url(#pill)">
    <rect x="-90" y="0" width="60" height="84" fill="#ffffff" opacity="0.28" transform="skewX(-20)">
      <animate attributeName="x" values="-90;380" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- rocket bobbing -->
  <g>
    <text x="48" y="50" font-size="26" text-anchor="middle" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">&#x1F680;</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 -4;0 0" dur="1.4s" repeatCount="indefinite"/>
  </g>

  <!-- label -->
  <text x="160" y="50" font-size="23" font-weight="700" text-anchor="middle" fill="#ffffff" letter-spacing="0.5"
        font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Live demo</text>

  <!-- arrow sliding -->
  <g>
    <path d="M262 42 H282 M274 34 L282 42 L274 50" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="1.2s" repeatCount="indefinite"/>
  </g>
</svg>
